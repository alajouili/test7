
name: Deploy Staging Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - '**/*.tf'
      - '.github/workflows/terraform-staging.yml'
  workflow_dispatch:
jobs:
  terraform:
    name: Terraform Staging
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform-pipeline

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-3

    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform files
        run: |
          pwd
          ls -la
          terraform version

      - name: Set Staging Suffix
        id: suffix
        run: echo "suffix=21575daf" >> "$GITHUB_OUTPUT"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var="random_suffix=${{ steps.suffix.outputs.suffix }}" -var="environment=staging"

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="random_suffix=${{ steps.suffix.outputs.suffix }}" -var="environment=staging"